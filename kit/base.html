%%DOC_HEAD%%<title>%%TITLE%%</title>
<meta name="description" content="%%DESCRIPTION%%">
<script>document.documentElement.classList.add('js');document.documentElement.lang='%%LANG%%';</script>
<style>
/* explorable-plan kit. Colours, font stack and the open/close labels come from the theme
   (generated by build.py from the metadata block); everything below uses only those variables. */
%%THEME_CSS%%
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.55 var(--font);overflow-x:hidden;overflow-wrap:break-word}
::selection{background:var(--selection)}
.band{background:var(--paper);color:var(--ink);padding:64px 0}
.band-wash{--paper:var(--wash);background:var(--wash)}
.band-dark{--paper:var(--band-dark);--ink:var(--band-dark-ink);--muted:var(--band-dark-muted);--rule:var(--band-dark-rule);--wash:var(--band-dark-wash);--accent:var(--band-dark-ink);background:var(--paper);color:var(--ink)}
.col{max-width:800px;margin:0 auto;padding:0 24px}
h1,h2,h3,h4{font-family:var(--font);font-weight:600;line-height:1.2;text-wrap:balance}
h1{font-size:40px;margin:0 0 20px}
h2{font-size:32px;margin:0 0 24px}
h3{font-size:22px;margin:32px 0 12px}
p{margin:0 0 20px}
.lead{font-size:20px}
.label{font-size:15px;font-weight:400;color:var(--muted);margin:0 0 12px}
.small{font-size:14px}
.note{font-size:13px;color:var(--muted)}
code,.id{font-family:var(--mono);font-size:.92em}
code{overflow-wrap:anywhere}
.id{white-space:nowrap}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--paper);padding:8px 12px}
.skip:focus{left:12px;top:12px;z-index:10}
b,strong{font-weight:700}
ul,ol{margin:0 0 20px;padding-left:24px}
li{margin:0 0 8px}
hr{border:0;border-top:1px solid var(--rule);margin:32px 0}
.only-js{display:none}
.js .only-js{display:block}
.js .only-nojs{display:none}

/* masthead and opening */
.masthead{border-bottom:1px solid var(--rule);padding:20px 0}
.masthead .col{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--ink);margin:32px 0 0}
.facts div{padding:12px 16px 0 0;min-width:0}
.facts dt{font-size:15px;color:var(--muted);margin:0 0 4px}
.facts dd{margin:0;font-size:16px}
.toc{columns:2;column-gap:32px;font-size:16px;padding-left:20px;margin:0}
.toc li{break-inside:avoid}

/* two-column grid (choices made, comparisons) and the large quote */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:24px 32px;margin:0 0 32px}
.choices>div{border-top:1px solid var(--rule);padding-top:12px;min-width:0}
.choices h3{margin:0 0 8px;font-size:20px}
.choices p{margin:0;font-size:16px}
blockquote.pull{margin:40px 0 0;padding:16px 0 0;border-top:1px solid var(--ink)}
blockquote.pull p{font-size:28px;line-height:1.25;margin:0 0 12px}
blockquote.pull footer{font-size:14px;color:var(--muted)}

/* figures and SVG diagrams (colours from theme variables only) */
figure{margin:32px 0}
figcaption{font-size:14px;color:var(--muted);margin-top:12px}
.source{font-size:13px;color:var(--muted);margin-top:8px}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--font);fill:currentColor}
svg .t-muted,svg .t-muted text{fill:var(--muted)}
svg .s-ink{stroke:currentColor}
svg .s-muted{stroke:var(--muted)}
svg .s-rule{stroke:var(--rule)}
svg .f-paper{fill:var(--paper)}
svg .f-wash{fill:var(--wash)}
svg .f-ink{fill:currentColor}
svg .f-muted{fill:var(--muted)}
.diag-v{display:none}
@media (max-width:649px){.diag-h{display:none}.diag-v{display:block}}

/* WAI-ARIA tabs */
[role=tablist]{display:flex;flex-wrap:wrap;gap:4px 20px;border-bottom:1px solid var(--rule);margin:0 0 24px;padding:0}
[role=tab]{font:inherit;font-size:17px;background:none;border:0;color:var(--muted);padding:8px 0 7px;margin:0 0 -1px;cursor:pointer;border-bottom:2px solid transparent}
[role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
[role=tab]:hover{color:var(--ink)}
.tabpanel>h3:first-child{margin-top:0}

/* buttons and controls */
.btn{font:inherit;font-size:16px;background:var(--accent);color:var(--paper);border:1px solid var(--accent);border-radius:2px;padding:9px 16px;cursor:pointer}
.btn-2{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.choice{border:0;padding:0;margin:20px 0 0}
.choice legend{font-size:15px;color:var(--muted);padding:0;margin:0 0 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.action{font:inherit;font-size:16px;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:7px 12px;cursor:pointer;text-align:left}
.action:hover{border-color:var(--ink)}
.action[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.action small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
select,input[type=number],input[type=date],input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--muted);border-radius:2px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:96px;line-height:1.45}
input[type=range]{width:100%}
::placeholder{color:var(--muted);opacity:1}
label{cursor:pointer}
.slider-row{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;margin:0 0 8px}
.slider-row output{font-size:20px;min-width:3em;text-align:right}
.slider-row input[type=range]{grid-column:1/-1}

/* tables, outcomes, check lists */
table{border-collapse:collapse;width:100%;font-size:15px;margin:0 0 16px}
th,td{text-align:left;vertical-align:top;padding:8px 12px 8px 0;border-bottom:1px solid var(--rule)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num+th,td.num+td{padding-left:16px}
caption{caption-side:top;text-align:left;color:var(--muted);padding:0 0 6px}
th{font-weight:400;color:var(--muted);font-size:14px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.outcome{margin:20px 0 0;min-height:1px}
.outcome:empty{display:none}
.outcome-box{border-top:1px solid var(--ink);padding-top:12px}
.outcome-tag{font-size:20px;font-weight:600;margin:0 0 6px}
.outcome-box p{margin:0 0 8px;font-size:16px}
.checks{list-style:none;padding:0;margin:0 0 16px;font-size:15px}
.checks li{padding:6px 0;border-bottom:1px solid var(--rule);display:flex;gap:10px;margin:0}
.checks .g{flex:none;width:7.5em;font-weight:700}
.checks .ko .g{text-decoration:underline;text-decoration-thickness:2px}
pre{font-family:var(--mono);font-size:13px;line-height:1.45;background:var(--wash);padding:12px;overflow-x:auto;margin:0 0 16px;white-space:pre-wrap;word-break:break-word}

/* disclosure */
.disc-h{margin:0;font-size:20px}
.disc-btn{font:inherit;font-size:20px;font-weight:600;background:none;border:0;color:var(--ink);padding:12px 0;width:100%;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--rule)}
.disc-btn::after{content:'';flex:none}
.js .disc-btn[aria-expanded=false]::after{content:var(--ui-open);font-size:14px;font-weight:400;color:var(--muted);align-self:center}
.js .disc-btn[aria-expanded=true]::after{content:var(--ui-close);font-size:14px;font-weight:400;color:var(--muted);align-self:center}
.disc-body{padding:0 0 12px}
.disc-body p{font-size:16px}

/* steps: numbered tabs with previous and next */
.steps-nav{gap:4px 6px}
.steps-nav [role=tab]{min-width:36px;text-align:center;padding:6px 6px 5px;font-size:17px}
.steps-nav [role=tab] .m{display:block;font-size:11px;font-family:var(--mono);color:var(--muted);line-height:1.1;min-height:1.1em}
.step-meta{font-size:14px;color:var(--muted);margin:0 0 12px}
.step-ctrl{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.js .step-ctrl.only-js{display:flex}

/* horizontal bars with a cap (costs, durations): .seg.a in the accent, .seg.b in grey */
.bars{margin:24px 0 8px}
.bar{display:grid;grid-template-columns:150px 1fr 100px;gap:8px 12px;align-items:center;margin:0 0 14px}
.bar .lab{font-size:15px}
.bar .val{font-size:16px;text-align:right}
.track{height:24px;position:relative;display:flex;border-right:1px solid var(--ink)}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--rule);z-index:0}
.track .seg{position:relative;z-index:1;height:100%}
.seg.a{background:var(--accent)}
.seg.b{background:var(--muted)}
.seg+.seg{margin-left:2px}
.axis{display:grid;grid-template-columns:150px 1fr 100px;gap:12px;font-size:12px;color:var(--muted)}
.axis .scale{position:relative;height:16px}
.axis .scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis .scale span:first-child{transform:none}
.axis .scale span:last-child{transform:translateX(-100%)}

/* decisions with a composable answer */
.decision{border-top:1px solid var(--rule);padding:16px 0 4px}
.decision h3{margin:0 0 8px}
.decision label{display:flex;gap:10px;align-items:baseline;font-size:16px;margin:0 0 8px}
.kpi-row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:16px;margin:8px 0}
.kpi-row label{margin:0;display:flex;gap:8px;align-items:center}
.answer textarea{min-height:150px;background:var(--paper)}
.copied{font-size:14px;color:var(--muted);margin-left:12px}

footer.page-end{border-top:1px solid var(--rule);padding:32px 0 48px;font-size:13px;color:var(--muted)}
footer.page-end p{margin:0 0 8px}
footer.page-end ol.versions{list-style:none;padding-left:0;margin:0 0 16px}
footer.page-end ol.versions li{margin:0 0 4px}

@media (max-width:649px){
  body{font-size:16px}
  .band{padding:48px 0}
  .col{padding:0 18px}
  h1{font-size:32px}
  h2{font-size:27px}
  h3{font-size:20px}
  .lead{font-size:18px}
  blockquote.pull p{font-size:24px}
  .facts{grid-template-columns:1fr 1fr}
  .toc{columns:1}
  .choices{grid-template-columns:1fr}
  .bar,.axis{grid-template-columns:1fr 90px}
  .bar .lab{grid-column:1/-1}
  .axis .blank,.axis .scale span.mid{display:none}
  th,td{padding-right:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  [hidden]{display:block!important}
  .js .only-nojs{display:block!important}
  .no-print,[role=tablist],.choice,.step-ctrl{display:none!important}
  .band{padding:24px 0}
}
</style>
%%DOC_BODY%%
<div lang="%%LANG%%" data-plan-theme="%%THEME%%">

%%CONTENT%%

<footer class="page-end" id="sources">
<div class="col">
%%FOOTER%%
%%SOURCES%%
%%SIGNATURE%%
</div>
</footer>
</div>

<script>
window.PLAN_UI=%%UI%%;
